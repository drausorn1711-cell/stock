<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockMaster - ระบบจัดการสินค้าและสต็อกสินค้าแบบเรียลไทม์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <div class="max-w-7xl mx-auto px-4 py-6">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 bg-white p-4 rounded-2xl shadow-sm border border-gray-100 gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 text-white p-2.5 rounded-xl text-xl">📦</div>
                <div>
                    <h1 class="text-xl font-bold text-gray-900">StockMaster</h1>
                    <p class="text-xs text-gray-500">ระบบจัดการสินค้าและสต็อกสินค้าแบบเรียลไทม์ (Supabase)</p>
                </div>
            </div>
            <div class="flex flex-wrap gap-2">
                <button onclick="alert('ฟังก์ชันส่งออก PDF')" class="border border-gray-200 hover:bg-gray-50 text-gray-700 px-3 py-2 rounded-xl text-xs font-medium transition flex items-center space-x-1">
                    <span>📄 ส่งออก PDF นำเข้า</span>
                </button>
                <button onclick="alert('ฟังก์ชันประวัติสต็อก')" class="border border-gray-200 hover:bg-gray-50 text-gray-700 px-3 py-2 rounded-xl text-xs font-medium transition flex items-center space-x-1">
                    <span>📑 PDF ประวัติสต็อก</span>
                </button>
                <button onclick="alert('ฟังก์ชันส่งออก Excel')" class="border border-gray-200 hover:bg-gray-50 text-gray-700 px-3 py-2 rounded-xl text-xs font-medium transition flex items-center space-x-1">
                    <span>📊 ส่งออก Excel</span>
                </button>
                <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-xs font-medium transition flex items-center space-x-1">
                    <span>+ เพิ่มสินค้าใหม่</span>
                </button>
            </div>
        </header>

        <!-- Stats Overview -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center">
                <div>
                    <p class="text-sm text-gray-500">รายการสินค้าทั้งหมด</p>
                    <h3 id="totalProducts" class="text-2xl font-bold text-gray-900 mt-1">0</h3>
                </div>
                <div class="bg-blue-50 text-blue-600 p-3 rounded-xl">📦</div>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center">
                <div>
                    <p class="text-sm text-gray-500">จำนวนสต็อกรวม</p>
                    <h3 id="totalStock" class="text-2xl font-bold text-gray-900 mt-1">0</h3>
                </div>
                <div class="bg-emerald-50 text-emerald-600 p-3 rounded-xl">📥</div>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center">
                <div>
                    <p class="text-sm text-gray-500">สต็อกใกล้หมด</p>
                    <h3 id="lowStockCount" class="text-2xl font-bold text-red-600 mt-1">0</h3>
                </div>
                <div class="bg-amber-50 text-amber-600 p-3 rounded-xl">⚠️</div>
            </div>
        </div>

        <!-- Main Content Box -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <!-- Tabs & Filters -->
            <div class="p-4 border-b border-gray-100 flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex space-x-2 border-b md:border-b-0 w-full md:w-auto">
                    <button class="px-4 py-2 text-sm font-medium text-blue-600 border-b-2 border-blue-600">คลังสินค้า</button>
                    <button class="px-4 py-2 text-sm font-medium text-gray-400 hover:text-gray-600">ประวัติความเคลื่อนไหว</button>
                </div>
                <div class="flex flex-wrap gap-2 w-full md:w-auto">
                    <input type="text" id="searchInput" onkeyup="renderTable()" placeholder="ค้นหาตามชื่อสินค้า หรือ SKU/ขนาด..." class="border border-gray-200 rounded-xl px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 flex-1 md:w-64">
                    <select id="categoryFilter" onchange="renderTable()" class="border border-gray-200 rounded-xl px-3 py-2 text-sm outline-none bg-white">
                        <option value="">ทุกหมวดหมู่</option>
                    </select>
                    <select id="stockFilter" onchange="renderTable()" class="border border-gray-200 rounded-xl px-3 py-2 text-sm outline-none bg-white">
                        <option value="">สต็อกทั้งหมด</option>
                        <option value="low">สต็อกใกล้หมด</option>
                    </select>
                </div>
            </div>

            <!-- Table -->
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-100 bg-gray-50/50 text-xs text-gray-500 uppercase">
                            <th class="p-4">รูปภาพ</th>
                            <th class="p-4">ขนาด/SKU</th>
                            <th class="p-4">ชื่อสินค้า</th>
                            <th class="p-4">หมวดหมู่</th>
                            <th class="p-4">คงเหลือ</th>
                            <th class="p-4 text-center">จัดการสต็อก</th>
                            <th class="p-4 text-center">การกระทำ</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody" class="divide-y divide-gray-100 text-sm">
                        <tr>
                            <td colspan="7" class="p-8 text-center text-gray-400">กำลังโหลดข้อมูล...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Form -->
    <div id="productModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl">
            <h2 id="modalTitle" class="text-lg font-bold mb-4">เพิ่มสินค้าใหม่</h2>
            <form id="productForm" onsubmit="saveProduct(event)">
                <input type="hidden" id="productId">
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">ชื่อสินค้า</label>
                        <input type="text" id="name" required class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">ขนาด/SKU</label>
                            <input type="text" id="size" required class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">หมวดหมู่</label>
                            <input type="text" id="category" required class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">จำนวนเริ่มต้น</label>
                            <input type="number" id="quantity" value="0" required class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">แจ้งเตือนขั้นต่ำ</label>
                            <input type="number" id="minStock" value="5" required class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">รูปภาพสินค้า</label>
                        <input type="file" id="imageFile" accept="image/*" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                        <input type="hidden" id="imageUrl">
                    </div>
                </div>
                <div class="flex justify-end space-x-2 mt-6">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-xl">ยกเลิก</button>
                    <button type="submit" class="px-4 py-2 text-sm bg-blue-600 hover:bg-blue-700 text-white rounded-xl">บันทึก</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ตั้งค่าการเชื่อมต่อ Supabase
        const SUPABASE_URL = 'https://qoltfllmlghwjvnyzsmw.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_16ovxA1x3Zr38PHWohJlA_sB0Ge...';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let products = [];

        async function fetchProducts() {
            const { data, error } = await supabaseClient.from('products').select('*').order('id', { ascending: false });
            if (error) {
                console.error('Error fetching:', error);
                return;
            }
            products = data || [];
            updateCategoryDropdown();
            renderTable();
        }

        function updateCategoryDropdown() {
            const categorySet = [...new Set(products.map(p => p.category))];
            const select = document.getElementById('categoryFilter');
            const currentVal = select.value;
            select.innerHTML = '<option value="">ทุกหมวดหมู่</option>';
            categorySet.forEach(cat => {
                if (cat) {
                    select.innerHTML += `<option value="${cat}">${cat}</option>`;
                }
            });
            select.value = currentVal;
        }

        function renderTable() {
            const tbody = document.getElementById('productTableBody');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const catFilter = document.getElementById('categoryFilter').value;
            const stockFilter = document.getElementById('stockFilter').value;

            tbody.innerHTML = '';
            
            let totalStock = 0;
            let lowStockCount = 0;

            const filtered = products.filter(p => {
                const matchSearch = (p.name && p.name.toLowerCase().includes(search)) || (p.size && p.size.toLowerCase().includes(search));
                const matchCat = !catFilter || p.category === catFilter;
                const matchStock = stockFilter !== 'low' || Number(p.quantity) <= Number(p.minStock);
                return matchSearch && matchCat && matchStock;
            });

            products.forEach(p => {
                totalStock += Number(p.quantity);
                if (Number(p.quantity) <= Number(p.minStock)) lowStockCount++;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-gray-400">ไม่พบรายการสินค้า</td></tr>`;
            } else {
                filtered.forEach(p => {
                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-50/50">
                            <td class="p-4"><img src="${p.image || 'https://via.placeholder.com/50'}" class="w-10 h-10 object-cover rounded-lg"></td>
                            <td class="p-4 text-gray-600">${p.size}</td>
                            <td class="p-4 font-medium text-gray-900">${p.name}</td>
                            <td class="p-4"><span class="bg-gray-100 px-2.5 py-1 rounded-full text-xs text-gray-600">${p.category}</span></td>
                            <td class="p-4 font-bold text-gray-900">${p.quantity}</td>
                            <td class="p-4 text-center">
                                <button onclick="updateQty(${p.id}, -1)" class="w-7 h-7 bg-gray-100 hover:bg-gray-200 rounded-lg text-sm">-</button>
                                <button onclick="updateQty(${p.id}, 1)" class="w-7 h-7 bg-gray-100 hover:bg-gray-200 rounded-lg text-sm ml-1">+</button>
                            </td>
                            <td class="p-4 text-center">
                                <button onclick="editProduct(${p.id})" class="text-blue-600 hover:underline mr-2 text-xs font-medium">แก้ไข</button>
                                <button onclick="deleteProduct(${p.id})" class="text-red-600 hover:underline text-xs font-medium">ลบ</button>
                            </td>
                        </tr>
                    `;
                });
            }

            document.getElementById('totalProducts').innerText = products.length;
            document.getElementById('totalStock').innerText = totalStock;
            document.getElementById('lowStockCount').innerText = lowStockCount;
        }

        function openModal() {
            document.getElementById('productForm').reset();
            document.getElementById('productId').value = '';
            document.getElementById('imageUrl').value = '';
            document.getElementById('modalTitle').innerText = 'เพิ่มสินค้าใหม่';
            document.getElementById('productModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('productModal').classList.add('hidden');
        }

        document.getElementById('imageFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const MAX_WIDTH = 300;
                        const MAX_HEIGHT = 300;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                        } else {
                            if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        document.getElementById('imageUrl').value = canvas.toDataURL('image/jpeg', 0.7);
                    }
                }
                reader.readAsDataURL(file);
            }
        });

        async function saveProduct(e) {
            e.preventDefault();
            const id = document.getElementById('productId').value;
            const name = document.getElementById('name').value;
            const size = document.getElementById('size').value;
            const category = document.getElementById('category').value;
            const quantity = parseInt(document.getElementById('quantity').value);
            const minStock = parseInt(document.getElementById('minStock').value);
            let image = document.getElementById('imageUrl').value;

            if (!image && id) {
                const oldP = products.find(p => p.id == id);
                if (oldP) image = oldP.image;
            }

            const productData = { name, size, category, quantity, minStock, image };

            if (id) {
                await supabaseClient.from('products').update(productData).eq('id', id);
            } else {
                await supabaseClient.from('products').insert([productData]);
            }

            closeModal();
            fetchProducts();
        }

        async function updateQty(id, amount) {
            const p = products.find(item => item.id == id);
            if (!p) return;
            const newQty = Math.max(0, p.quantity + amount);
            await supabaseClient.from('products').update({ quantity: newQty }).eq('id', id);
            fetchProducts();
        }

        async function editProduct(id) {
            const p = products.find(item => item.id == id);
            if (!p) return;
            document.getElementById('productId').value = p.id;
            document.getElementById('name').value = p.name;
            document.getElementById('size').value = p.size;
            document.getElementById('category').value = p.category;
            document.getElementById('quantity').value = p.quantity;
            document.getElementById('minStock').value = p.minStock;
            document.getElementById('imageUrl').value = p.image || '';
            document.getElementById('modalTitle').innerText = 'แก้ไขสินค้า';
            document.getElementById('productModal').classList.remove('hidden');
        }

        async function deleteProduct(id) {
            if (confirm('คุณต้องการลบสินค้านี้ใช่หรือไม่?')) {
                await supabaseClient.from('products').delete().eq('id', id);
                fetchProducts();
            }
        }

        fetchProducts();
    </script>
</body>
</html>
